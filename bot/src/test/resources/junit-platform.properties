# Tests run in parallel, every test class and method concurrently (docs/conventions.md, "Tests run in
# parallel"): each owns its clock, server, state directory and log; nothing is shared. Four at a
# time: the dev server and the garrison share the machine, and at one thread a core the server's
# watchdog killed it for a 60-second tick.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
