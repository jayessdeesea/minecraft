spring:
  ai:
    # Every provider is configured; each echelon picks one below (minecraft.*.chat-model).
    # Provider choice lives here, never in code.
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:14b
          # Qwen3 reasons before answering by default: ~20s per decision with it, ~0.5s without.
          think-option: FALSE
          temperature: 0.3

minecraft:
  general:
    # The model the general thinks with: "anthropic" (a frontier model; needs ANTHROPIC_API_KEY)
    # or "ollama" (the local open-weight model, see compose.yaml).
    chat-model: ollama
    # The operator's standing rule that no squad spends the night outside a patrol base: an order
    # that leaves one in the open after dark is replaced by a patrol base where it stands. A garrison
    # wants it; a scenario that sends squads out at night doesn't.
    shelter-at-night: false
    # The operator's intent - the one order that comes from outside the chain of command.
    mission: >-
      Reconnoitre the terrain around the squad's start point and establish an observation post
      on high ground within 80 blocks, from which the squad can watch for hostile activity.
  squad-leader:
    # The model every squad leader thinks with: "ollama" or "anthropic", as for the general.
    chat-model: ollama
  # The order of battle: "Squad:Soldier,Soldier,...;Squad:...", formation order, the first soldier
  # of the first squad carrying the radio. Soldiers' names are their usernames on the server.
  roster: "Alpha:Alice,Bob,Carol,Gus;Bravo:Dana,Eli,Fran,Hal"
  # Stand the squads still, asking no model anything, while a live experiment runs on this machine
  # (the scenario harness holds a lock file for each run) - for a garrison sharing the GPU.
  yield-to-experiments: false
  # Players who may replace the mission from game chat with "!mission <text>", comma-separated.
  # Empty: nobody.
  # Offline mode doesn't authenticate names, so this guards against accidents, not impostors.
  operators: ""
  # The camp the squads build up as a lodgment (docs/military-doctrine.md §17), as "x,z": its
  # progress through the phases is measured and shown to the general. Empty: no camp.
  camp: ""
  supply:
    # The supply point: a chest the operator places and stocks, as "x,y,z" (the chest's block).
    # The general can send a squad there; soldiers short of a weapon or armour draw from it.
    # Empty: no supply point.
    point: ""
