spring:
  ai:
    # Every provider is configured; each echelon picks one below (minecraft.*.chat-model).
    # Provider choice lives here, never in code.
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:14b
          # Qwen3 reasons before answering by default: ~20s per decision with it, ~0.5s without.
          think-option: FALSE
          temperature: 0.3

minecraft:
  platoon-leader:
    # The model the platoon leader thinks with: "anthropic" (a frontier model; needs ANTHROPIC_API_KEY)
    # or "ollama" (the local open-weight model, see compose.yaml).
    chat-model: ollama
    # Its prompts: the fixed system prompt, the user prompt's template, and the template each
    # squad's section of it is filled in from (parameters marked «name»).
    system-prompt: classpath:prompts/platoon-leader-system-prompt.md
    user-prompt: classpath:prompts/platoon-leader-user-prompt.md
    squad-prompt: classpath:prompts/platoon-leader-squad-prompt.md
    # The operator's standing rule that no squad spends the night outside a patrol base: an order
    # that leaves one in the open after dark is replaced by a patrol base where it stands. A garrison
    # wants it; a scenario that sends squads out at night doesn't.
    shelter-at-night: false
    # The operator's day rule: by day, every squad builds the main base's keep (command.Keep),
    # whatever the platoon leader orders - logged beside its order. The night rule still comes first.
    keep-by-day: false
    # The operator's intent - the one order that comes from outside the chain of command.
    mission: >-
      Reconnoitre the terrain around the squad's start point and establish an observation post
      on high ground within 80 blocks, from which the squad can watch for hostile activity.
  squad-leader:
    # How every squad leader decides: "drills", by standing rules (command.DrillSquadLeader), or
    # "model", with the model below.
    decides-with: drills
    # The model a squad leader thinks with when it decides with one: "ollama" or "anthropic", as for the platoon leader.
    chat-model: ollama
    # Its prompts: the fixed system prompt and the user prompt's template, as for the platoon leader.
    system-prompt: classpath:prompts/squad-leader-system-prompt.md
    user-prompt: classpath:prompts/squad-leader-user-prompt.md
  # The order of battle: "Squad:Soldier,Soldier,...;Squad:...", formation order, the first soldier
  # of the first squad carrying the radio. Soldiers' names are their usernames on the server.
  roster: "Alpha:Alice,Bob,Carol,Gus;Bravo:Dana,Eli,Fran,Hal;Charlie:Ivy,Jack,Kate,Liam;Delta:Mia,Ned,Olga,Pete"
  # Stand the squads still, asking no model anything, while a live experiment runs on this machine
  # (the scenario harness holds a lock file for each run) - for a garrison sharing the GPU.
  yield-to-experiments: false
  # Players who may replace the mission from game chat with "!mission <text>", comma-separated.
  # Empty: nobody.
  # Offline mode doesn't authenticate names, so this guards against accidents, not impostors.
  operators: ""
  # The ground the squads flatten by day under keep-by-day (command.Flatten): "x1 z1 x2 z2 y", that
  # rectangle taken down to y - everything above it dug out. An operator replaces it from chat with
  # "!flatten x1 z1 x2 z2 y".
  flatten: "-16 -16 16 16 63"
  # The squad that keeps the camp's farm by day as its standing job; no other squad farms but under
  # an order to. Empty: none - half a hungry squad farms by the field-feeding rule.
  farm-squad: Delta
  # The camp the squads build up as a lodgment (docs/military-doctrine.md §17), as "x,z": its
  # progress through the phases is measured and shown to the platoon leader. Empty: no camp.
  camp: ""
  # Where what the garrison builds is remembered across restarts - each camp wall's layout.
  state-dir: "garrison-state"
  supply:
    # The supply point: a chest the operator places and stocks, as "x,y,z" (the chest's block).
    # The platoon leader can send a squad there; soldiers short of a weapon or armour draw from it.
    # Empty: no supply point.
    point: ""
