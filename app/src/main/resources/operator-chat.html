<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platoon leader</title>
<style>
  :root { --bg: #f6f6f3; --fg: #1d1d1b; --muted: #6b6b66; --line: #d8d8d2; --op: #e6eef8; --pl: #ffffff; --err: #a32020; --night: #2b3550; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e8e8e4; --muted: #9a9a94; --line: #34363a; --op: #1f2b3b; --pl: #222427; --err: #ff7b7b; --night: #9fb2e6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }
  #clock { display: flex; gap: 24px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #clock div span { color: var(--muted); font-size: 12px; display: block; text-transform: uppercase; letter-spacing: .05em; }
  #clock b { font-size: 18px; font-weight: 600; }
  #clock .night { color: var(--night); }
  #athand { margin-left: auto; display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
  #athand b { font-size: 15px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .turn { max-width: 760px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; }
  .operator { align-self: flex-end; background: var(--op); }
  .pl { align-self: flex-start; background: var(--pl); }
  .who { color: var(--muted); font-size: 12px; display: block; }
  .error { color: var(--err); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: vertical; min-height: 44px; font: inherit; padding: 8px; background: var(--pl); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
  button { font: inherit; padding: 0 18px; border-radius: 6px; border: 1px solid var(--line); background: var(--op); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #main { flex: 1; display: flex; min-height: 0; }
  #talk { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #status { flex: 1.4; overflow: auto; padding: 12px 16px; border-left: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
  #status h2 { font-size: 15px; margin: 14px 0 2px; }
  #status h2:first-child { margin-top: 0; }
  #status .objective { color: var(--muted); margin: 0 0 6px; }
  #status table { border-collapse: collapse; width: 100%; min-width: 1500px; table-layout: fixed; }
  #status td, #status th { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* What a soldier is doing, its order and its report are read whole: two lines each, every row two lines high, so rows hold still. */
  #status td { height: 3.3em; }
  #status td.words { white-space: normal; }
  #status td.words div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #status th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  #status th, #status td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  #status td.activity, #status td.nowrap { white-space: nowrap; }
  #status td.activity { font-weight: 600; }
  #status td.muted, #status .stale { color: var(--muted); }
  #status .warn { color: var(--err); }
  @media (max-width: 900px) { #main { flex-direction: column; } #status { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="clock">
  <div><span>Minecraft time</span><b id="time">-</b></div>
  <div><span>Next dusk in</span><b id="dusk">-</b></div>
  <div><span>Next dawn in</span><b id="dawn">-</b></div>
  <div id="athand" title="What the force has at hand: carried by its soldiers plus held in every chest known"></div>
</div>
<div id="main">
  <div id="talk">
    <div id="log"></div>
    <form id="form">
      <textarea id="message" placeholder="Talk to the platoon leader (Enter sends, Shift+Enter a new line)" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <div id="status"><p class="stale">The garrison's status hasn't been fetched yet.</p></div>
</div>
<script>
"use strict";
// The overworld clock as the server last sent it (GET /clock), ticked forward here between fetches:
// a Minecraft day is 24,000 ticks, 20 minutes - 20 ticks a second.
const DAY = 24000, DUSK = 13178, TICKS_A_SECOND = 20, FETCH_EVERY_MS = 30000;
let clock = null, fetchedAt = 0;

async function fetchClock() {
  try {
    const r = await fetch("/clock", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    clock = await r.json();
    fetchedAt = performance.now();
  } catch (e) {
    clock = { error: String(e) };
  }
  showClock();
}

function wait(ticks) {
  const s = Math.floor(ticks / TICKS_A_SECOND);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function showClock() {
  const time = document.getElementById("time"), dusk = document.getElementById("dusk"), dawn = document.getElementById("dawn");
  if (!clock || clock.error || !clock.known) {
    time.textContent = clock && clock.error ? "unreachable" : "not sent yet";
    dusk.textContent = dawn.textContent = "-";
    return;
  }
  const passed = clock.running ? Math.floor((performance.now() - fetchedAt) / 1000 * TICKS_A_SECOND) : 0;
  const ticks = (clock.ticks + passed) % DAY;
  const gameSeconds = Math.floor((6 * 3600 + ticks * 3.6)) % 86400;
  const dark = ticks >= DUSK;
  time.textContent = String(Math.floor(gameSeconds / 3600)).padStart(2, "0") + ":" + String(Math.floor(gameSeconds / 60) % 60).padStart(2, "0")
    + (dark ? " night" : " day") + (clock.running ? "" : " (clock stopped)");
  time.className = dark ? "night" : "";
  dusk.textContent = clock.running ? wait(ticks < DUSK ? DUSK - ticks : DAY - ticks + DUSK) : "never";
  dawn.textContent = clock.running ? wait(DAY - ticks) : "never";
}

// The conversation is the page's: every turn goes back with each new message.
const turns = [];
const log = document.getElementById("log"), form = document.getElementById("form"),
      box = document.getElementById("message"), send = document.getElementById("send");

function say(cls, who, text) {
  const div = document.createElement("div");
  div.className = "turn " + cls;
  const name = document.createElement("span");
  name.className = "who";
  name.textContent = who;
  div.appendChild(name);
  div.appendChild(document.createTextNode(text));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = box.value.trim();
  if (!message) return;
  box.value = "";
  send.disabled = true;
  say("operator", "Operator", message);
  const waiting = say("pl", "PL", "...");
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ turns: turns, message: message })
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    waiting.lastChild.textContent = body.reply + (body.done || []).map(d => "\n[" + d + "]").join("");
    turns.push({ operator: message, platoonLeader: body.reply });
  } catch (e) {
    waiting.classList.add("error");
    waiting.lastChild.textContent = "No answer: " + e.message;
  } finally {
    send.disabled = false;
    box.focus();
  }
});

box.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

// The garrison's status (GET /status), fetched every second and drawn afresh: a squad a table, a soldier a row -
// where it stands (red when far from the rest), its health and food, what it's doing (a fight, a recovery, its task or
// none) and for how long, the routine that has its hands, its order, its report, how often its activity has changed
// (those that were returns to the one just left, in brackets) and what it carries. Columns are fixed widths and a cell
// one line, so rows don't move as their words change; a cell's whole text is its hover.
const STATUS_EVERY_MS = 1000;
const statusBox = document.getElementById("status");

function cell(row, text, cls) {
  const td = document.createElement("td"), said = text === null || text === undefined ? "-" : String(text);
  if (cls && cls.split(" ").includes("words")) {
    const lines = document.createElement("div"); // up to two lines of it shown (#status td.words div)
    lines.textContent = said;
    td.appendChild(lines);
  } else {
    td.textContent = said;
  }
  td.title = said; // cut short where it's long: the whole of it on hover
  if (cls) td.className = cls;
  row.appendChild(td);
  return td;
}

// What the force has at hand, at a glance: each resource as its soldiers carry it (a soldier's "carries", by item) plus
// what every chest known holds (the status's "stores") - the two named differently, so paired here.
const AT_HAND = [
  ["Logs", "log", "logs"], ["Stone", "cobblestone", "stone"], ["Iron", "iron_ingot", "ironIngots"], ["Raw iron", "raw_iron", "rawIron"],
  ["Copper", "copper_ingot", "copperIngots"], ["Food", "food", "rations"], ["Wheat", "wheat", "wheat"], ["Seeds", "seeds", "seeds"],
  ["Saplings", "sapling", "saplings"], ["Dirt", "dirt", "dirt"], ["Torches", "torch", null], ["Coal", "coal", null]
];

function showAtHand(status) {
  const box = document.getElementById("athand"), carried = {};
  for (const squad of status.squads) {
    for (const s of squad.soldiers) {
      for (const [what, count] of Object.entries(s.carries || {})) carried[what] = (carried[what] || 0) + count;
    }
  }
  box.replaceChildren();
  for (const [title, item, store] of AT_HAND) {
    const onSoldiers = carried[item] || 0, inChests = store === null ? 0 : (status.stores || {})[store] || 0;
    const div = document.createElement("div"), label = document.createElement("span"), count = document.createElement("b");
    label.textContent = title;
    count.textContent = (onSoldiers + inChests).toLocaleString("en-US");
    div.title = title + ": " + onSoldiers + " carried" + (store === null ? "; not counted in chests" : ", " + inChests + " in chests");
    div.append(label, count);
    box.appendChild(div);
  }
}

// The middle of the force - the median of its soldiers' x, y and z, each on its own - and how far a soldier may be
// from it before its place is shown as too far out.
const SPREAD_BLOCKS = 256;

function median(values) {
  const sorted = [...values].sort((a, b) => a - b), mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function held(seconds) {
  if (seconds === null) return "";
  return seconds < 60 ? seconds + " s" : Math.floor(seconds / 60) + " min " + String(seconds % 60).padStart(2, "0") + " s";
}

function showStatus(status) {
  statusBox.replaceChildren();
  if (!status.squads.some(s => s.soldiers.length)) {
    const p = document.createElement("p");
    p.className = "stale";
    p.textContent = "No soldier has joined yet.";
    statusBox.appendChild(p);
    return;
  }
  showAtHand(status);
  const everyone = status.squads.flatMap(squad => squad.soldiers);
  const middle = { x: median(everyone.map(s => s.x)), y: median(everyone.map(s => s.y)), z: median(everyone.map(s => s.z)) };
  for (const squad of status.squads) {
    const h = document.createElement("h2");
    h.textContent = squad.name;
    statusBox.appendChild(h);
    const objective = document.createElement("p");
    objective.className = "objective";
    objective.textContent = squad.objective === null ? "No objective." : squad.objective + (squad.intent ? " - " + squad.intent : "");
    statusBox.appendChild(objective);
    if (squad.task) {
      // The task as the code has it, and what was last measured of it: computed, whatever words the objective was given in.
      const task = document.createElement("p");
      task.className = "objective";
      task.textContent = "Task " + squad.task + (squad.progress ? ": " + squad.progress : "");
      statusBox.appendChild(task);
    }
    const table = document.createElement("table"), head = table.insertRow();
    // The columns that hold still first, each a fixed width, then the ones whose words change: a row keeps its place and its height.
    const columns = [["Soldier", "6%", ""], ["Location", "8%", "Where it stands. Red: over " + SPREAD_BLOCKS + " blocks from the middle of the force (the median of every soldier's x, y and z)."],
      ["Health", "4%", "Out of 20."], ["Food", "4%", "Out of 20."], ["Doing", "13%", "Its activity: a fight, a recovery, its task, or none."], ["For", "6%", "How long it has been doing that."],
      ["Hands", "7%", "The routine that has its hands - what it's physically doing this tick - or free."], ["Order", "13%", "Its squad leader's order."],
      ["Report", "18%", "What it last reported up."],
      ["Changes", "5%", "How many times its activity has changed since it joined; in brackets, how many of those went straight back to what it had just left. A high count in brackets is a soldier flipping between two things."],
      ["Carries", "16%", "What's in its pack."]];
    for (const [title, width, tip] of columns) {
      const th = document.createElement("th");
      th.textContent = title;
      th.style.width = width;
      th.title = tip;
      head.appendChild(th);
    }
    for (const s of squad.soldiers) {
      const row = table.insertRow();
      cell(row, s.unit === squad.name ? s.name : s.name + " (" + s.unit + ")");
      const out = Math.round(Math.hypot(s.x - middle.x, s.y - middle.y, s.z - middle.z));
      cell(row, s.x + ", " + s.y + ", " + s.z, out > SPREAD_BLOCKS ? "warn" : "").title = out + " blocks from the middle of the force, at ("
        + Math.round(middle.x) + ", " + Math.round(middle.y) + ", " + Math.round(middle.z) + ")";
      cell(row, s.health === null ? null : Math.round(s.health), s.health !== null && s.health <= 8 ? "warn" : "");
      cell(row, s.food, s.food !== null && s.food <= 6 ? "warn" : "");
      const stuck = s.taskState === "STALLED" || s.taskState === "CANTCO";
      cell(row, s.activity === null ? null : s.activity + (stuck ? " [" + s.taskState + "]" : ""), "words activity" + (stuck ? " warn" : ""));
      cell(row, held(s.seconds));
      cell(row, s.hands === null ? "free" : s.hands, s.hands === null ? "muted" : "");
      cell(row, s.order, "words");
      cell(row, s.report, "words");
      cell(row, s.changes === null ? null : s.changes + " (" + s.returns + ")", "muted");
      cell(row, Object.entries(s.carries || {}).map(([what, count]) => what.replace(/_/g, " ") + " " + count).join(", "), "words muted");
    }
    statusBox.appendChild(table);
  }
}

async function fetchStatus() {
  try {
    const r = await fetch("/status", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    showStatus(await r.json());
  } catch (e) {
    statusBox.classList.add("stale");
    statusBox.title = "Not fetched: " + e + " - what's shown is the last answer.";
    return;
  }
  statusBox.classList.remove("stale");
  statusBox.title = "";
}

fetchClock();
fetchStatus();
setInterval(fetchStatus, STATUS_EVERY_MS);
setInterval(fetchClock, FETCH_EVERY_MS);
setInterval(showClock, 1000);
</script>
</body>
</html>
